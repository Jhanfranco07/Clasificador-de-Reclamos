name: CI

on:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    services:
      postgres:
        image: public.ecr.aws/supabase/postgres:17.11.0.011
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: smartclaim_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 12
    env:
      SMARTCLAIM_TEST_PG_DSN: postgresql://postgres:postgres@127.0.0.1:5432/smartclaim_test
      SMARTCLAIM_TEST_SECURITY_PG: "1"
      OPENAI_API_KEY: ""
      USE_OPENAI_EMBEDDINGS: "false"
      MODEL_PROVIDER: local
      PYTHON_DOTENV_DISABLED: "1"
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install --requirement requirements.txt
      - run: python -B -m pytest -q

  frontend:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
          cache: pip
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: python -m pip install --requirement requirements.txt
      - run: npm ci
        working-directory: frontend
      - name: Comprobar TypeScript
        run: npx --yes --package typescript@5.8.3 tsc --noEmit --allowImportingTsExtensions --jsx react-jsx --moduleResolution bundler --module esnext --target es2022 --skipLibCheck --types vite/client src/main.tsx
        working-directory: frontend
      - name: Compilar frontend
        run: npm run build
        working-directory: frontend
        env:
          VITE_API_URL: http://127.0.0.1:8000
      - name: Instalar Chromium de Playwright
        run: npx playwright install --with-deps chromium
        working-directory: frontend
      - name: Ejecutar Playwright sin red externa
        shell: bash
        env:
          VITE_API_URL: http://127.0.0.1:8000
          OPENAI_API_KEY: ""
          USE_OPENAI_EMBEDDINGS: "false"
          MODEL_PROVIDER: local
          PYTHON_DOTENV_DISABLED: "1"
        run: |
          set -euo pipefail
          control="/tmp/smartclaim-control-$GITHUB_RUN_ID"
          python tests/serve_offline.py --control-dir "$control" >"$RUNNER_TEMP/api.log" 2>&1 &
          api_pid=$!
          (cd frontend && npm exec vite -- preview --host 127.0.0.1 --port 5173) >"$RUNNER_TEMP/frontend.log" 2>&1 &
          web_pid=$!
          cleanup() {
            mkdir -p "$control"
            touch "$control/stop"
            kill "$web_pid" "$api_pid" 2>/dev/null || true
          }
          trap cleanup EXIT
          for attempt in {1..180}; do
            curl --fail --silent http://127.0.0.1:8000/health >/dev/null \
              && curl --fail --silent http://127.0.0.1:5173 >/dev/null \
              && break
            if ! kill -0 "$api_pid" 2>/dev/null; then
              cat "$RUNNER_TEMP/api.log"
              exit 1
            fi
            sleep 1
          done
          curl --fail --silent http://127.0.0.1:8000/health >/dev/null || {
            cat "$RUNNER_TEMP/api.log"; exit 1;
          }
          curl --fail --silent http://127.0.0.1:5173 >/dev/null || {
            cat "$RUNNER_TEMP/frontend.log"; exit 1;
          }
          cd frontend
          npx playwright test --config playwright.offline.config.ts
          touch "$control/stop"
          wait "$api_pid"
          NETWORK_FILE="$control/network.json" python - <<'PY'
          import json, os
          with open(os.environ["NETWORK_FILE"], encoding="utf-8") as stream:
              assert json.load(stream)["unexpected"] == []
          PY
